  SCR_FieldManualConfigCategory "{6AA19CB200000400}" {
   m_sTitle "Insurgency Advanced"
   m_aCategories {
    SCR_FieldManualConfigCategory "{6AA19CB200000420}" {
     m_sTitle "Insurgency Advanced"
     m_aEntries {
      SCR_FieldManualConfigEntry_Standard "{6AA19CB200000401}" {
       m_sTitle "Zones"
       m_Image "{53DF1DA25771D359}UI/Textures/MissionLoadingScreens/Reforger_ConflictSmallArt_UI.edds"
       m_aContent {
        SCR_FieldManualPiece_Header "{6AA19CB200000430}" {
         m_sText "Map colours"
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000402}" {
         m_sText "Red - Insurgent territory. Subtle purple - Defenders approaching. Insurgent forces are moving to defend the area."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB200000441}" {
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000440}" {
         m_sText "Yellow - Capture in progress."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB200000443}" {
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000442}" {
         m_sText "Green - Permanently secured."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB200000445}" {
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000444}" {
         m_sText "Orange - Counterattack pending or underway."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB200000403}" {
        }
        SCR_FieldManualPiece_Header "{6AA19CB200000431}" {
         m_sText "Capture on foot"
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000404}" {
         m_sText "To capture a zone, dismount, clear nearby insurgents and stay on foot within 100m of the zone centre for 15 seconds. Driving through is not enough. If the insurgents fail to rally defenders after three attempts, move in and secure the ground. If approaching defenders cannot reach the area within five minutes, you can secure it without waiting for them. Any insurgents within 200m of the zone centre must still be killed or captured. Watch for insurgent vehicles: their crews can hold ground too."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB200000405}" {
        }
        SCR_FieldManualPiece_Header "{6AA19CB200000432}" {
         m_sText "Hold your ground"
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000406}" {
         m_sText "Insurgents may attempt a counterattack. Look out for orange zones, stay nearby and prepare to defend them. Kill or capture the attacking insurgents and reclaim any ground they retake. Leaving threatened ground undefended risks losing it."
        }
       }
      }
      SCR_FieldManualConfigEntry_Standard "{6AA19CB200000407}" {
       m_sTitle "Camps"
       m_Image "{2756229DA9DAD415}UI/Textures/MissionLoadingScreens/Reforger_HQCArt_Everon_UI.edds"
       m_aContent {
        SCR_FieldManualPiece_Header "{6AA19CB200000433}" {
         m_sText "Find and clear"
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000408}" {
         m_sText "Look for insurgent camps in woodland. Clear and capture them to weaken the insurgents' local foothold. Their zones use the same map colours as other territory."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB200000409}" {
        }
        SCR_FieldManualPiece_Header "{6AA19CB200000434}" {
         m_sText "Search the arsenal"
        }
        SCR_FieldManualPiece_Text "{6AA19CB20000040A}" {
         m_sText "Some camps contain a weapon cache; others offer intel at their arsenal. Use Search camp for intel on the equipment box. Arsenal searches offer better intel odds than searching bodies, but success is not guaranteed."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB20000040B}" {
        }
        SCR_FieldManualPiece_Header "{6AA19CB200000435}" {
         m_sText "Secure a spawn point"
        }
        SCR_FieldManualPiece_Text "{6AA19CB20000040C}" {
         m_sText "Each arsenal allows one team search, even if unsuccessful. Capturing a camp does not destroy its cache: deal with both. Watch for orange zones and defend against insurgent counterattacks. Once permanently secured, the camp joins your faction and becomes a friendly respawn location. Check your task list for progress."
        }
       }
      }
      SCR_FieldManualConfigEntry_Standard "{6AA19CB20000040D}" {
       m_sTitle "Caches"
       m_Image "{1D454359A2B513A4}UI/Textures/MissionLoadingScreens/Mission03.edds"
       m_aContent {
        SCR_FieldManualPiece_Header "{6AA19CB200000436}" {
         m_sText "Follow the intel"
        }
        SCR_FieldManualPiece_Text "{6AA19CB20000040E}" {
         m_sText "Insurgent weapon caches are key objectives. Gather intel, use the map hints to reach the search area, then locate the actual cache. A hint is a search area, not an exact position; more intel narrows it down."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB20000040F}" {
        }
        SCR_FieldManualPiece_Header "{6AA19CB200000437}" {
         m_sText "Destroy the cache"
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000410}" {
         m_sText "Destroy the cache and check the task list for progress. Clearing insurgents or capturing its zone alone does not destroy it. Warn your team and stand clear: caches are explosive."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB200000411}" {
        }
        SCR_FieldManualPiece_Header "{6AA19CB200000438}" {
         m_sText "Check your objectives"
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000412}" {
         m_sText "Follow the mission's task list. Depending on the mission, victory may also require capturing camps and other zones."
        }
       }
      }
      SCR_FieldManualConfigEntry_Standard "{6AA19CB200000413}" {
       m_sTitle "Acquiring intel"
       m_Image "{2756229DA9DAD415}UI/Textures/MissionLoadingScreens/Reforger_HQCArt_Everon_UI.edds"
       m_aContent {
        SCR_FieldManualPiece_Header "{6AA19CB200000439}" {
         m_sText "Search bodies"
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000414}" {
         m_sText "Search insurgent bodies or captured prisoners for physical intel, once per insurgent for the whole team. Searching and questioning are separate attempts; do both in either order."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB200000415}" {
        }
        SCR_FieldManualPiece_Header "{6AA19CB20000043A}" {
         m_sText "Capture and question prisoners"
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000416}" {
         m_sText "Capturing and questioning insurgents gives much better intel odds than killing and searching them alone. Secure an unconscious insurgent, treat their wounds and stop bleeding, then question them once they are conscious. Prisoners stay secured and cannot move or fight."
        }
        SCR_FieldManualPiece_LineBreak "{6AA19CB20000043E}" {
        }
        SCR_FieldManualPiece_Header "{6AA19CB20000043C}" {
         m_sText "Read the map"
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000418}" {
         m_sText "Check the map after gaining intel. More information narrows cache-location hints. Share the search area with your squad."
        }
       }
      }
      SCR_FieldManualConfigEntry_Standard "{6AA19CB200000450}" {
       m_sTitle "Pastafarianism"
       m_Image "{53DF1DA25771D359}UI/Textures/MissionLoadingScreens/Reforger_ConflictSmallArt_UI.edds"
       m_aContent {
        SCR_FieldManualPiece_Header "{6AA19CB200000451}" {
         m_sText "Respect His Noodly Appendage"
        }
        SCR_FieldManualPiece_Text "{6AA19CB200000452}" {
         m_sText "The Flying Spaghetti Monster watches over the island. Do not kill captured prisoners. Protect them, stop their bleeding and treat their wounds. His Noodliness is displeased by executions; mercy is the Pastafarian way. Share your pasta, not your bullets. R'amen."
        }
       }
      }
     }
    }
   }
  }
 }
}